plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vjk.sample'
version = '0.0.1-SNAPSHOT'
description = 'Demo_API_Validation'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    finalizedBy(tasks.jacocoTestReport)
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (JUnit @Tag("integration")).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.test
    useJUnitPlatform {
        includeTags 'integration'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.named('check') {
    dependsOn tasks.integrationTest, tasks.jacocoTestCoverageVerification
}

tasks.named('jacocoTestReport') {
    executionData tasks.test, tasks.integrationTest
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    executionData tasks.test, tasks.integrationTest
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 0.70
            }
        }
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'demo-api-validation'
        property 'sonar.projectName', 'Demo_API_Validation'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
    }
}
